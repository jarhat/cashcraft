global
    log stdout format raw local0

defaults
    mode http
    timeout connect 10s
    timeout client 10m
    timeout server 10m

frontend docker_api
    bind :2375
    acl read_method method GET
    acl write_method method POST
    acl reload_container path_reg -i ^(/v[0-9.]+)?/containers/(docker-gen|nginx-proxy|[a-f0-9]{12,64})/kill$
    acl reload_signal url_param(signal) -m reg -i ^SIGHUP$
    http-request deny if !read_method !write_method
    http-request deny if write_method !reload_container
    http-request deny if write_method !reload_signal
    use_backend docker_write if write_method
    default_backend docker_read

backend docker_read
    server socket_proxy docker-socket-read:2375

backend docker_write
    server socket_proxy docker-socket-write:2375
