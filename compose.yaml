services:
  netcraft:
    build:
      context: ./NetCraft
      dockerfile: Dockerfile.server
    environment:
      NETCRAFT_DB: /data/netcraft.db
      NETCRAFT_MINING_REWARDS_ENABLED: ${NETCRAFT_MINING_REWARDS_ENABLED:-true}
      BCH_NETWORK: ${BCH_NETWORK:-mainnet}
      BCH_REWARD_CATEGORY: ${BCH_REWARD_CATEGORY:?Set BCH_REWARD_CATEGORY in .env}
      NETCRAFT_REWARD_API: auth:3000
      NETCRAFT_REWARD_WAKE_SECRET: ${NETCRAFT_REWARD_WAKE_SECRET:?Set NETCRAFT_REWARD_WAKE_SECRET in .env}
      NETCRAFT_BLOCK_CATEGORIES: ${NETCRAFT_BLOCK_CATEGORIES:-}
      NETCRAFT_BLOCK_CATEGORY_1: ${NETCRAFT_BLOCK_CATEGORY_1:-}
      NETCRAFT_BLOCK_CATEGORY_2: ${NETCRAFT_BLOCK_CATEGORY_2:-}
      NETCRAFT_BLOCK_CATEGORY_3: ${NETCRAFT_BLOCK_CATEGORY_3:-}
      NETCRAFT_BLOCK_CATEGORY_4: ${NETCRAFT_BLOCK_CATEGORY_4:-}
      NETCRAFT_BLOCK_CATEGORY_5: ${NETCRAFT_BLOCK_CATEGORY_5:-}
      NETCRAFT_BLOCK_CATEGORY_6: ${NETCRAFT_BLOCK_CATEGORY_6:-}
      NETCRAFT_BLOCK_CATEGORY_7: ${NETCRAFT_BLOCK_CATEGORY_7:-}
      NETCRAFT_BLOCK_CATEGORY_8: ${NETCRAFT_BLOCK_CATEGORY_8:-}
      NETCRAFT_BLOCK_CATEGORY_9: ${NETCRAFT_BLOCK_CATEGORY_9:-}
      NETCRAFT_BLOCK_CATEGORY_10: ${NETCRAFT_BLOCK_CATEGORY_10:-}
      NETCRAFT_BLOCK_CATEGORY_11: ${NETCRAFT_BLOCK_CATEGORY_11:-}
      NETCRAFT_BLOCK_CATEGORY_12: ${NETCRAFT_BLOCK_CATEGORY_12:-}
      NETCRAFT_BLOCK_CATEGORY_13: ${NETCRAFT_BLOCK_CATEGORY_13:-}
      NETCRAFT_BLOCK_CATEGORY_14: ${NETCRAFT_BLOCK_CATEGORY_14:-}
      NETCRAFT_BLOCK_CATEGORY_15: ${NETCRAFT_BLOCK_CATEGORY_15:-}
      NETCRAFT_BLOCK_CATEGORY_16: ${NETCRAFT_BLOCK_CATEGORY_16:-}
      NETCRAFT_BLOCK_CATEGORY_17: ${NETCRAFT_BLOCK_CATEGORY_17:-}
      NETCRAFT_BLOCK_CATEGORY_18: ${NETCRAFT_BLOCK_CATEGORY_18:-}
      NETCRAFT_BLOCK_CATEGORY_19: ${NETCRAFT_BLOCK_CATEGORY_19:-}
      NETCRAFT_BLOCK_CATEGORY_20: ${NETCRAFT_BLOCK_CATEGORY_20:-}
      NETCRAFT_BLOCK_CATEGORY_21: ${NETCRAFT_BLOCK_CATEGORY_21:-}
      NETCRAFT_BLOCK_CATEGORY_22: ${NETCRAFT_BLOCK_CATEGORY_22:-}
      NETCRAFT_BLOCK_CATEGORY_23: ${NETCRAFT_BLOCK_CATEGORY_23:-}
      NETCRAFT_BLOCK_CATEGORY_32: ${NETCRAFT_BLOCK_CATEGORY_32:-}
      NETCRAFT_BLOCK_CATEGORY_33: ${NETCRAFT_BLOCK_CATEGORY_33:-}
      NETCRAFT_BLOCK_CATEGORY_34: ${NETCRAFT_BLOCK_CATEGORY_34:-}
      NETCRAFT_BLOCK_CATEGORY_35: ${NETCRAFT_BLOCK_CATEGORY_35:-}
      NETCRAFT_BLOCK_CATEGORY_36: ${NETCRAFT_BLOCK_CATEGORY_36:-}
      NETCRAFT_BLOCK_CATEGORY_37: ${NETCRAFT_BLOCK_CATEGORY_37:-}
      NETCRAFT_BLOCK_CATEGORY_38: ${NETCRAFT_BLOCK_CATEGORY_38:-}
      NETCRAFT_BLOCK_CATEGORY_39: ${NETCRAFT_BLOCK_CATEGORY_39:-}
      NETCRAFT_BLOCK_CATEGORY_40: ${NETCRAFT_BLOCK_CATEGORY_40:-}
      NETCRAFT_BLOCK_CATEGORY_41: ${NETCRAFT_BLOCK_CATEGORY_41:-}
      NETCRAFT_BLOCK_CATEGORY_42: ${NETCRAFT_BLOCK_CATEGORY_42:-}
      NETCRAFT_BLOCK_CATEGORY_43: ${NETCRAFT_BLOCK_CATEGORY_43:-}
      NETCRAFT_BLOCK_CATEGORY_44: ${NETCRAFT_BLOCK_CATEGORY_44:-}
      NETCRAFT_BLOCK_CATEGORY_45: ${NETCRAFT_BLOCK_CATEGORY_45:-}
      NETCRAFT_BLOCK_CATEGORY_46: ${NETCRAFT_BLOCK_CATEGORY_46:-}
      NETCRAFT_BLOCK_CATEGORY_47: ${NETCRAFT_BLOCK_CATEGORY_47:-}
      NETCRAFT_BLOCK_CATEGORY_48: ${NETCRAFT_BLOCK_CATEGORY_48:-}
      NETCRAFT_BLOCK_CATEGORY_49: ${NETCRAFT_BLOCK_CATEGORY_49:-}
      NETCRAFT_BLOCK_CATEGORY_50: ${NETCRAFT_BLOCK_CATEGORY_50:-}
      NETCRAFT_BLOCK_CATEGORY_51: ${NETCRAFT_BLOCK_CATEGORY_51:-}
      NETCRAFT_BLOCK_CATEGORY_52: ${NETCRAFT_BLOCK_CATEGORY_52:-}
      NETCRAFT_BLOCK_CATEGORY_53: ${NETCRAFT_BLOCK_CATEGORY_53:-}
      NETCRAFT_BLOCK_CATEGORY_54: ${NETCRAFT_BLOCK_CATEGORY_54:-}
      NETCRAFT_BLOCK_CATEGORY_55: ${NETCRAFT_BLOCK_CATEGORY_55:-}
      NETCRAFT_BLOCK_CATEGORY_56: ${NETCRAFT_BLOCK_CATEGORY_56:-}
      NETCRAFT_BLOCK_CATEGORY_57: ${NETCRAFT_BLOCK_CATEGORY_57:-}
      NETCRAFT_BLOCK_CATEGORY_58: ${NETCRAFT_BLOCK_CATEGORY_58:-}
      NETCRAFT_BLOCK_CATEGORY_59: ${NETCRAFT_BLOCK_CATEGORY_59:-}
      NETCRAFT_BLOCK_CATEGORY_60: ${NETCRAFT_BLOCK_CATEGORY_60:-}
      NETCRAFT_BLOCK_CATEGORY_61: ${NETCRAFT_BLOCK_CATEGORY_61:-}
      NETCRAFT_BLOCK_CATEGORY_62: ${NETCRAFT_BLOCK_CATEGORY_62:-}
      NETCRAFT_BLOCK_CATEGORY_63: ${NETCRAFT_BLOCK_CATEGORY_63:-}
      NETCRAFT_BLOCK_CATEGORY_64: ${NETCRAFT_BLOCK_CATEGORY_64:-}
      NETCRAFT_BLOCK_CATEGORY_65: ${NETCRAFT_BLOCK_CATEGORY_65:-}
      NETCRAFT_BLOCK_CATEGORY_66: ${NETCRAFT_BLOCK_CATEGORY_66:-}
      NETCRAFT_BLOCK_CATEGORY_67: ${NETCRAFT_BLOCK_CATEGORY_67:-}
    volumes:
      - ./data:/data
    restart: unless-stopped
    networks:
      - app-network

  netcraft-websockify:
    build:
      context: ./NetCraft
      dockerfile: Dockerfile.websockify
    environment:
      VIRTUAL_HOST: ${NETCRAFT_WS_DOMAIN:?Set NETCRAFT_WS_DOMAIN in .env}
      VIRTUAL_PORT: "4081"
      LETSENCRYPT_HOST: ${NETCRAFT_WS_DOMAIN:?Set NETCRAFT_WS_DOMAIN in .env}
      LETSENCRYPT_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
    expose:
      - "4081"
    depends_on:
      - netcraft
    restart: unless-stopped
    networks:
      - app-network

  bchn:
    image: uphold/bitcoin-cash-node
    command:
      - -printtoconsole
      - -server=1
      - -wallet=${BCH_WALLET:-token-sender}
      - -disablewallet=0
      - -prune=${BCH_PRUNE_MIB:-10000}
      - -rpcbind=127.0.0.1
      - -rpcbind=172.31.0.10
      - -rpcallowip=172.31.0.11/32
      - -rpcport=8332
      - -rpcuser=${BCH_RPC_USER:?Set BCH_RPC_USER in .env}
      - -rpcpassword=${BCH_RPC_PASSWORD:?Set BCH_RPC_PASSWORD in .env}
      - -testnet=0
    volumes:
      - bchn-data:/home/bitcoin/.bitcoin
    restart: unless-stopped
    networks:
      app-network:
      bchn-rpc-network:
        ipv4_address: 172.31.0.10
    healthcheck:
      test: ["CMD-SHELL", "bitcoin-cli -rpcuser=$${BCH_RPC_USER} -rpcpassword=$${BCH_RPC_PASSWORD} getblockchaininfo >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    environment:
      BCH_RPC_USER: ${BCH_RPC_USER:?Set BCH_RPC_USER in .env}
      BCH_RPC_PASSWORD: ${BCH_RPC_PASSWORD:?Set BCH_RPC_PASSWORD in .env}

  auth:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      VIRTUAL_HOST: ${AUTH_DOMAIN:?Set AUTH_DOMAIN in .env}
      VIRTUAL_PORT: "3000"
      LETSENCRYPT_HOST: ${AUTH_DOMAIN:?Set AUTH_DOMAIN in .env}
      LETSENCRYPT_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}

      PORT: "3000"
      BCH_NETWORK: ${BCH_NETWORK:-mainnet}
      UNLOCK_TIME: "${UNLOCK_TIME:-1893456000}"
      CASHADDR_DB_PATH: /data/cash-addresses.sqlite3
      NETCRAFT_DB_PATH: /data/netcraft.db
      NETCRAFT_MINING_REWARDS_ENABLED: ${NETCRAFT_MINING_REWARDS_ENABLED:-true}
      NETCRAFT_REWARD_WAKE_SECRET: ${NETCRAFT_REWARD_WAKE_SECRET:?Set NETCRAFT_REWARD_WAKE_SECRET in .env}
      CRAFT_PREVIEW_IMAGE: /app/craft-preview.png

      BCH_RPC_URL: http://172.31.0.10:8332/
      BCH_RPC_USER: ${BCH_RPC_USER:?Set BCH_RPC_USER in .env}
      BCH_RPC_PASSWORD: ${BCH_RPC_PASSWORD:?Set BCH_RPC_PASSWORD in .env}
      BCH_WALLET: ${BCH_WALLET:-token-sender}
      BCH_REWARD_CATEGORY: ${BCH_REWARD_CATEGORY:?Set BCH_REWARD_CATEGORY in .env}

      # Optional: source address required only by /api/tx-proof.
      BCH_ALLOWED_SENDER: ${BCH_ALLOWED_SENDER:-}

      # Optional: categories required only by /api/tx-proof.
      BCH_ALLOWED_TOKEN_CATEGORIES: ${BCH_ALLOWED_TOKEN_CATEGORIES:-}

      # Require this many confirmations before recording the address.
      BCH_REQUIRED_CONFIRMATIONS: ${BCH_REQUIRED_CONFIRMATIONS:-0}
    volumes:
      - ./data:/data
    restart: unless-stopped
    depends_on:
      bchn:
        condition: service_healthy
    networks:
      app-network:
      bchn-rpc-network:
        ipv4_address: 172.31.0.11

  cashtoken-wallet:
    build:
      context: .
      args:
        BCH_NETWORK: ${BCH_NETWORK:-mainnet}
        VITE_CONSOLE_LOG_LEVEL: ${VITE_CONSOLE_LOG_LEVEL:-error}
        VITE_NETCRAFT_WS_URL: wss://${NETCRAFT_WS_DOMAIN:?Set NETCRAFT_WS_DOMAIN in .env}/craftws
    expose:
      - "8080"
    volumes:
      - type: bind
        source: ${NETCRAFT_BUILD_PATH:-./NetCraft/build}
        target: /srv/games/netcraft
        read_only: true
      - type: bind
        source: ${PK2_BUILD_PATH:-./PK2/build}
        target: /srv/games/pk2
        read_only: true
    environment:
      VIRTUAL_HOST: ${WALLET_DOMAIN:?Set WALLET_DOMAIN in .env}
      VIRTUAL_PORT: "8080"
      LETSENCRYPT_HOST: ${WALLET_DOMAIN:?Set WALLET_DOMAIN in .env}
      LETSENCRYPT_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
    restart: unless-stopped
    networks:
      - app-network

  # Keep your existing auth service unchanged.

  nginx-proxy:
    image: nginx:stable-alpine
    container_name: nginx-proxy
    labels:
      com.github.nginx-proxy.nginx-proxy.nginx: "true"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - nginx-conf:/etc/nginx/conf.d:ro
      - nginx-certs:/etc/nginx/certs:ro
      - nginx-vhost:/etc/nginx/vhost.d:ro
      - nginx-html:/usr/share/nginx/html:ro
    restart: unless-stopped
    depends_on:
      - docker-gen
    networks:
      - app-network

  acme-companion:
    image: nginxproxy/acme-companion:2.5.2
    container_name: acme-companion
    environment:
      DEFAULT_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
      NGINX_PROXY_CONTAINER: nginx-proxy
      NGINX_DOCKER_GEN_CONTAINER: docker-gen
      DOCKER_HOST: tcp://docker-socket-router:2375
    volumes:
      - nginx-certs:/etc/nginx/certs:rw
      - nginx-vhost:/etc/nginx/vhost.d
      - nginx-html:/usr/share/nginx/html
      - acme-data:/etc/acme.sh
    depends_on:
      - nginx-proxy
      - docker-gen
    restart: unless-stopped
    networks:
      - app-network
      - docker-control

  docker-gen:
    image: nginxproxy/nginx-proxy:1.6.0
    container_name: docker-gen
    command: ["docker-gen", "-notify-sighup", "nginx-proxy", "-watch", "/app/nginx.tmpl", "/etc/nginx/conf.d/default.conf"]
    environment:
      DOCKER_HOST: tcp://docker-socket-router:2375
    volumes:
      - nginx-conf:/etc/nginx/conf.d
      - nginx-certs:/etc/nginx/certs:ro
      - nginx-vhost:/etc/nginx/vhost.d:ro
      - nginx-html:/usr/share/nginx/html:ro
    depends_on:
      docker-socket-router:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network
      - docker-control

  docker-socket-router:
    image: tecnativa/docker-socket-proxy:0.3.0
    entrypoint:
      - /usr/local/sbin/haproxy
    command:
      - -W
      - -db
      - -f
      - /usr/local/etc/haproxy/haproxy.cfg
    volumes:
      - ./docker-socket-router.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck: &docker-api-healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2375/_ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      docker-socket-read:
        condition: service_healthy
      docker-socket-write:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - docker-control
      - docker-api-backend

  docker-socket-read:
    image: tecnativa/docker-socket-proxy:0.3.0
    entrypoint: &socket-proxy-entrypoint
      - /bin/sh
      - -ec
      - |
        case "$$(printf '%s' "$$DISABLE_IPV6" | tr '[:upper:]' '[:lower:]')" in
          1|true|yes) bind_config=":2375" ;;
          *) bind_config="[::]:2375 v4v6" ;;
        esac
        sed "s/\$${BIND_CONFIG}/$$bind_config/g" /usr/local/etc/haproxy/haproxy.cfg.template > /tmp/haproxy.cfg
        exec haproxy -W -db -f /tmp/haproxy.cfg
    environment:
      CONTAINERS: "1"
      EVENTS: "1"
      INFO: "1"
      NETWORKS: "1"
      PING: "1"
      POST: "0"
      VERSION: "1"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck: *docker-api-healthcheck
    tmpfs:
      - /run
      - /tmp
      - /var/lib/haproxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    networks:
      - docker-api-backend

  docker-socket-write:
    image: tecnativa/docker-socket-proxy:0.3.0
    entrypoint: *socket-proxy-entrypoint
    environment:
      ALLOW_RESTARTS: "1"
      CONTAINERS: "0"
      POST: "1"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck: *docker-api-healthcheck
    tmpfs:
      - /run
      - /tmp
      - /var/lib/haproxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    networks:
      - docker-api-backend

networks:
  app-network:
    ipam:
      config:
        - subnet: 172.30.0.0/24
  bchn-rpc-network:
    internal: true
    ipam:
      config:
        - subnet: 172.31.0.0/24
  docker-control:
    internal: true
  docker-api-backend:
    internal: true

volumes:
  nginx-conf:
  bchn-data:
  nginx-certs:
  nginx-vhost:
  nginx-html:
  acme-data:

